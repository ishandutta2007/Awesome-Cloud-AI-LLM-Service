<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -1px;
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-float-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-float-4 { animation: floatPill 6.5s ease-in-out infinite 1.5s; }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: waveDash 4s linear infinite;
    }
  </style>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in the Background -->
  <g class="orb-1">
    <circle cx="220" cy="110" r="160" fill="url(#glowCyan)" filter="url(#softGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="290" r="170" fill="url(#glowPurple)" filter="url(#softGlow)" />
  </g>

  <!-- Animated Connection Streamlines behind foreground -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 Q 300 20 600 120 T 1150 100" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50 340 Q 400 390 750 300 T 1150 320" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Main Hero Text (Foreground - never obscured) -->
  <g id="hero-foreground">
    <!-- Category Top Tag -->
    <rect x="440" y="55" width="320" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <text x="600" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ CURATED CLOUD AI &amp; LLM ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" class="title-text">Awesome Cloud AI &amp; LLM Service</text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="200" text-anchor="middle" class="subtitle-text">Model Inference · Multi-Provider Gateways · Observability · Vector RAG</text>

    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b">
      The authoritative directory comparing enterprise SaaS platforms &amp; high-performance open-source infra
    </text>
  </g>

  <!-- Dynamic Feature Architecture Pills in Lower Foreground -->
  <g id="feature-pills" transform="translate(0, 275)">
    <!-- Pill 1: Model Serving -->
    <g class="pill-float-1" transform="translate(140, 0)">
      <rect width="200" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="30" cy="26" r="10" fill="#38bdf8" opacity="0.25" />
      <circle cx="30" cy="26" r="5" fill="#38bdf8" />
      <text x="115" y="32" text-anchor="middle" class="pill-text">🚀 vLLM · SGLang · Ollama</text>
    </g>

    <!-- Pill 2: Unified Gateways -->
    <g class="pill-float-2" transform="translate(370, 0)">
      <rect width="200" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="30" cy="26" r="10" fill="#818cf8" opacity="0.25" />
      <circle cx="30" cy="26" r="5" fill="#818cf8" />
      <text x="115" y="32" text-anchor="middle" class="pill-text">🔀 LiteLLM · Portkey · Route</text>
    </g>

    <!-- Pill 3: Observability -->
    <g class="pill-float-3" transform="translate(600, 0)">
      <rect width="200" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="30" cy="26" r="10" fill="#a855f7" opacity="0.25" />
      <circle cx="30" cy="26" r="5" fill="#a855f7" />
      <text x="115" y="32" text-anchor="middle" class="pill-text">📊 Langfuse · Arize Phoenix</text>
    </g>

    <!-- Pill 4: Vector RAG -->
    <g class="pill-float-4" transform="translate(830, 0)">
      <rect width="200" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="30" cy="26" r="10" fill="#ec4899" opacity="0.25" />
      <circle cx="30" cy="26" r="5" fill="#ec4899" />
      <text x="115" y="32" text-anchor="middle" class="pill-text">⚡ Qdrant · Milvus · Chroma</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>
